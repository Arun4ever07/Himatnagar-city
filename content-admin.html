<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Himatnagar Content Admin</title><style>:root{--n:#17374d;--o:#b65b1b;--bg:#f4f6f7;--p:#fff;--b:#d8e0e4;--t:#293940;--m:#68757c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Arial,sans-serif}.hide{display:none!important}.wrap{width:min(1100px,calc(100% - 28px));margin:auto}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,var(--n),#28536f)}.login form{width:min(430px,100%);padding:30px;color:#fff;background:#102938;border-radius:16px}h1,h2,h3{font-family:Georgia,serif}input,textarea,select{width:100%;padding:11px;border:1px solid var(--b);border-radius:8px;font:inherit}textarea{min-height:100px;resize:vertical}label{display:block;margin:13px 0 6px;font-size:.84rem;font-weight:bold}.top{color:#fff;background:var(--n);border-bottom:3px solid var(--o)}.topin{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:15px}.top h1{margin:0;font-size:1.2rem}.top p{margin:4px 0 0;color:#cbd9e1;font-size:.78rem}.main{padding:28px 0 60px}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.tab,.btn{border:1px solid transparent;border-radius:8px;min-height:40px;padding:0 14px;font-weight:bold;cursor:pointer}.tab{background:#e5edf1;color:var(--n)}.tab.active,.primary{background:var(--o);color:#fff}.light{background:#e6eef2;color:var(--n)}.danger{background:#ffe7e7;color:#b92f2f}.panel{padding:23px;background:var(--p);border:1px solid var(--b);border-radius:13px;box-shadow:0 7px 18px #17374d10}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.formActions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.upload{display:flex;gap:8px}.file{padding:11px;border:1px solid #ffd0ac;border-radius:8px;color:#873f0e;background:#fff0e3;white-space:nowrap;font-size:.8rem;font-weight:bold;cursor:pointer}.fileInput{display:none}.progress{height:7px;margin-top:8px;background:#e5edf1}.bar{width:0;height:100%;background:var(--o)}.items{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}.item{overflow:hidden;border:1px solid var(--b);border-radius:10px}.item img,.item video,.item iframe{width:100%;height:160px;border:0;object-fit:cover;background:#102938}.item div{padding:13px}.item h3{margin:0 0 6px;color:var(--n);font-size:1.1rem}.item p{margin:0;color:var(--m);font-size:.82rem;line-height:1.5}.actions{display:flex;gap:7px;margin-top:12px}.actions button{flex:1}.notice{display:none;padding:13px;margin-bottom:15px;border-radius:8px}.notice.show{display:block;background:#dff7e9;color:#087543}.notice.err{background:#ffe7e7;color:#a22b2b}.empty{grid-column:1/-1;padding:28px;border:1px dashed #bac7cf;color:var(--m);text-align:center}@media(max-width:700px){.topin{padding:14px 0;align-items:flex-start;flex-direction:column}.two,.items{grid-template-columns:1fr}.upload{flex-direction:column}}</style></head><body><section id="loginScreen" class="login"><form id="loginForm" action="javascript:void(0);"><h1>Himatnagar Content Admin</h1><p>Creators, News, History and Services</p><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" required><button id="loginButton" class="btn primary" type="submit" style="width:100%;margin-top:18px">Sign in securely</button><p id="loginMsg"></p></form></section><div id="appScreen" class="hide"><header class="top"><div class="wrap topin"><div><h1>Himatnagar Content Admin</h1><p id="adminEmail">Private Firebase manager</p></div><div><a href="index.html" target="_blank"><button class="btn light">View website</button></a><button id="logoutButton" class="btn light">Logout</button></div></div></header><main class="wrap main"><div id="notice" class="notice"></div><h2>Daily Content Manager</h2><p>Add, edit, delete, upload, and promote Himatnagar content.</p><div class="tabs"><button class="tab active" data-tab="creators">Creators</button><button class="tab" data-tab="news">News</button><button class="tab" data-tab="history">History</button><button class="tab" data-tab="services">Services</button></div><section class="panel"><input id="editId" type="hidden"><div class="two"><div><label id="labelA">Creator name</label><input id="name"></div><div><label id="labelB">Creator title</label><input id="title"></div></div><div id="creatorFields"><div class="two"><div><label>Media type</label><select id="mediaType"><option value="photo">Photo</option><option value="gif">GIF</option><option value="video">Direct MP4 Video</option><option value="iframe">YouTube/Vimeo Embed</option></select></div><div><label>Source/profile URL</label><input id="sourceUrl" placeholder="Instagram, YouTube, website"></div></div><label>Iframe code or embed URL</label><textarea id="embedInput" placeholder="Paste YouTube/Vimeo iframe code or embed URL"></textarea></div><label id="mediaLabel">Photo/GIF/MP4 direct URL</label><div class="upload"><input id="mediaUrl" placeholder="https://..."><label class="file" for="mediaFile">Upload file</label><input id="mediaFile" class="fileInput" type="file" accept="image/*,video/mp4,video/webm,video/quicktime"></div><div class="progress"><div id="bar" class="bar"></div></div><label>Description</label><textarea id="description"></textarea><div class="formActions"><button id="saveButton" class="btn primary">Add item</button><button id="cancelButton" class="btn light">Clear form</button></div><div id="items" class="items"></div></section></main></div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';import{getDatabase,ref,onValue,push,set,update,remove}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';import{getStorage,ref as sr,uploadBytesResumable,getDownloadURL}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js';const config={apiKey:'AIzaSyAlJ8KhAoWLz5snMA_QQs_t6PRd8l1Km1s',authDomain:'himmatnagar-city.firebaseapp.com',projectId:'himmatnagar-city',databaseURL:'https://himmatnagar-city-default-rtdb.asia-southeast1.firebasedatabase.app',storageBucket:'himmatnagar-city.firebasestorage.app',messagingSenderId:'58254936229',appId:'1:58254936229:web:8dc16282f5092ba0f9254c'};const ADMIN='etw6ueQBOCfzsJulYD5ShRNTodA2',app=initializeApp(config),auth=getAuth(app),db=getDatabase(app),storage=getStorage(app);const $=x=>document.getElementById(x),v=x=>$(x).value.trim(),put=(x,y)=>$(x).value=y||'';let user,type='creators',data=[];const esc=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const say=(m,e=false)=>{notice.textContent=m;notice.className='notice show'+(e?' err':'')};function embed(x){let m=String(x||'').match(/<iframe[^>]+src=["']([^"']+)["']/i),u=m?m[1]:String(x||'').trim();if(!u)return '';let a=new URL(u);if(!['www.youtube.com','youtube.com','www.youtube-nocookie.com','player.vimeo.com'].includes(a.hostname))throw Error('Only YouTube/Vimeo embeds are allowed.');if(a.pathname==='/watch'){let id=a.searchParams.get('v');if(!id)throw Error('Invalid YouTube URL.');return'https://www.youtube.com/embed/'+id}return a.href}function setup(){let c=type==='creators';creatorFields.classList.toggle('hide',!c);labelA.textContent=c?'Creator name':type==='history'?'Year / date':type==='news'?'News category':'Service category';labelB.textContent=c?'Creator title':type==='history'?'History title':type==='news'?'News title':'Service title';mediaLabel.textContent=c?'Photo/GIF/MP4 direct URL':'Image/GIF direct URL';saveButton.textContent=editId.value?'Update item':'Add '+type.slice(0,-1);onValue(ref(db,type),s=>{data=Object.entries(s.val()||{}).map(([id,x])=>({id,...x})).sort((a,b)=>(b.position||0)-(a.position||0));render()},{onlyOnce:false})}function render(){items.innerHTML=data.length?data.map(x=>{let med=x.mediaType==='iframe'&&x.embedUrl?`<iframe src="${esc(x.embedUrl)}" loading="lazy" allowfullscreen></iframe>`:x.mediaType==='video'?`<video controls src="${esc(x.mediaUrl)}"></video>`:x.mediaUrl?`<img src="${esc(x.mediaUrl)}">`:'';return`<article class="item">${med}<div><h3>${esc(x.title)}</h3><p>${esc(x.creatorName||x.name)}<br>${esc(x.description)}</p><div class="actions"><button class="btn light" data-edit="${x.id}">Edit</button><button class="btn danger" data-delete="${x.id}">Delete</button></div></div></article>`}).join(''):'<div class="empty">No '+type+' added yet.</div>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>del(b.dataset.delete))}function clear(){['editId','name','title','mediaUrl','sourceUrl','embedInput','description'].forEach(x=>put(x,''));put('mediaType','photo');saveButton.textContent='Add '+type.slice(0,-1)}function edit(id){let x=data.find(a=>a.id===id);put('editId',id);put('name',x.creatorName||x.name);put('title',x.title);put('mediaUrl',x.mediaUrl);put('sourceUrl',x.sourceUrl);put('embedInput',x.embedUrl);put('description',x.description);put('mediaType',x.mediaType||'photo');saveButton.textContent='Update item';scrollTo({top:0,behavior:'smooth'})}async function del(id){if(confirm('Delete this item?'))await remove(ref(db,type+'/'+id))}loginForm.addEventListener('submit',async e=>{e.preventDefault();try{loginButton.disabled=true;loginButton.textContent='Signing in...';await signInWithEmailAndPassword(auth,v('email'),$('password').value)}catch(e){loginMsg.textContent=e.code==='auth/invalid-credential'?'Incorrect email or password.':e.message}finally{loginButton.disabled=false;loginButton.textContent='Sign in securely'}});logoutButton.onclick=()=>signOut(auth);onAuthStateChanged(auth,u=>{if(!u){loginScreen.classList.remove('hide');appScreen.classList.add('hide');return}if(u.uid!==ADMIN){alert('Admin access denied.');signOut(auth);return}user=u;adminEmail.textContent=u.email;loginScreen.classList.add('hide');appScreen.classList.remove('hide');setup()});document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{type=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');clear();setup()});saveButton.onclick=async()=>{if(!v('title'))return say('Enter a title.',true);let eurl='';try{eurl=type==='creators'?embed(v('embedInput')):''}catch(e){return say(e.message,true)}let x={title:v('title'),name:v('name'),description:v('description'),mediaUrl:v('mediaUrl'),sourceUrl:v('sourceUrl'),mediaType:type==='creators'?v('mediaType'):'photo',embedUrl:eurl,updatedAt:Date.now(),updatedBy:user.uid};if(type==='creators')x.creatorName=v('name');let id=v('editId');if(id)await update(ref(db,type+'/'+id),x);else await set(push(ref(db,type)),{...x,position:Date.now(),createdAt:Date.now()});say('Saved successfully.');clear()};cancelButton.onclick=clear;mediaFile.onchange=async e=>{let f=e.target.files[0];if(!f)return;if(f.size>100*1024*1024)return say('Maximum upload is 100 MB.',true);try{let r=sr(storage,`city-assets/${user.uid}/${type}/${Date.now()}-${f.name.replace(/[^\w.-]/g,'-')}`),t=uploadBytesResumable(r,f,{contentType:f.type});t.on('state_changed',s=>bar.style.width=s.bytesTransferred/s.totalBytes*100+'%',e=>say(e.message,true),async()=>{put('mediaUrl',await getDownloadURL(t.snapshot.ref));if(f.type.startsWith('video/'))put('mediaType','video');else if(f.type==='image/gif')put('mediaType','gif');say('Upload complete. Now save the item.')})}catch(e){say(e.message,true)}e.target.value=''};</script></body></html>
